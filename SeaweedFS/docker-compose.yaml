services:
  master:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs-master
    command: >
      master
      -ip=master
      -ip.bind=0.0.0.0
      -port=9333
      -mdir=/data
      -volumeSizeLimitMB=1024
    ports:
      - "9333:9333"
      - "19333:19333"
    volumes:
      - ./data/master:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9333/cluster/status"]
      interval: 15s
      timeout: 5s
      retries: 5

  volume:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs-volume
    command: >
      volume
      -ip=volume
      -ip.bind=0.0.0.0
      -port=8080
      -mserver=master:9333
      -dir=/data
      -max=0
    ports:
      - "8080:8080"
      - "18080:18080"
    volumes:
      - ./data/volume:/data
    depends_on:
      master:
        condition: service_healthy
    restart: unless-stopped

  filer:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs-filer
    command: >
      filer
      -ip=filer
      -ip.bind=0.0.0.0
      -port=8888
      -master=master:9333
      -defaultReplicaPlacement=000
    ports:
      - "8888:8888"
      - "18888:18888"
    volumes:
      - ./data/filer:/data
    depends_on:
      - master
      - volume
    restart: unless-stopped

  s3:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs-s3
    command: >
      s3
      -ip=s3
      -ip.bind=0.0.0.0
      -port=8333
      -filer=filer:8888
      -config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"
    volumes:
      - ./s3.json:/etc/seaweedfs/s3.json:ro
    depends_on:
      - filer
    restart: unless-stopped

  admin:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs-admin
    command: >
      admin
      -ip=0.0.0.0
      -port=12535
      -master=master:9333
      -dataDir=/data
    environment:
      WEED_ADMIN_USER: ${SEAWEED_ADMIN_USER:-admin}
      WEED_ADMIN_PASSWORD: ${SEAWEED_ADMIN_PASSWORD:?Set SEAWEED_ADMIN_PASSWORD in .env}
    ports:
      - "12535:12535"
    volumes:
      - ./data/admin:/data
    depends_on:
      master:
        condition: service_healthy
      filer:
        condition: service_started
    restart: unless-stopped
