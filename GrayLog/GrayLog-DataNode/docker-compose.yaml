name: graylog

services:
  mongodb:
    image: mongo:7.0
    hostname: mongodb
    restart: unless-stopped
    networks:
      - graylog
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb

  datanode:
    image: graylog/graylog-datanode:7.1
    hostname: datanode
    restart: unless-stopped
    depends_on:
      - mongodb
    environment:
      GRAYLOG_DATANODE_NODE_ID_FILE: /var/lib/graylog-datanode/node-id
      GRAYLOG_DATANODE_PASSWORD_SECRET: ${GRAYLOG_PASSWORD_SECRET}
      GRAYLOG_DATANODE_MONGODB_URI: mongodb://mongodb:27017/graylog
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "8999:8999"   # Data Node API
      - "9200:9200"   # OpenSearch API
      - "9300:9300"   # Transport
    networks:
      - graylog
    volumes:
      - graylog_datanode:/var/lib/graylog-datanode

  graylog:
    image: graylog/graylog:7.1
    hostname: server
    restart: unless-stopped
    depends_on:
      - mongodb
      - datanode
    entrypoint: /usr/bin/tini -- /docker-entrypoint.sh
    environment:
      GRAYLOG_NODE_ID_FILE: /usr/share/graylog/data/config/node-id
      GRAYLOG_HTTP_BIND_ADDRESS: 0.0.0.0:9000
      GRAYLOG_HTTP_EXTERNAL_URI: http://127.0.0.1:9000/
      GRAYLOG_MONGODB_URI: mongodb://mongodb:27017/graylog
      GRAYLOG_PASSWORD_SECRET: ${GRAYLOG_PASSWORD_SECRET}
      GRAYLOG_ROOT_PASSWORD_SHA2: ${GRAYLOG_ROOT_PASSWORD_SHA2}
      GRAYLOG_REPORT_DISABLE_SANDBOX: "true"
    ports:
      - "9000:9000"     # Web UI / API
      - "1514:1514/udp" # Example Syslog UDP input
      - "1514:1514/tcp" # Example Syslog TCP input
      - "12201:12201/udp" # GELF UDP
      - "12201:12201/tcp" # GELF TCP
    networks:
      - graylog
    volumes:
      - graylog_data:/usr/share/graylog/data

networks:
  graylog:
    driver: bridge

volumes:
  mongodb_data:
  mongodb_config:
  graylog_datanode:
  graylog_data: