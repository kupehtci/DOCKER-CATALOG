# WSO2 docker compose file
version: '3.8'

services:
  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wso2_db
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --sql-mode=""
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 5

  wso2-apim:
    image: wso2/wso2am:4.4.0
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "9443:9443"  # Management console (https://localhost:9443/carbon)
      - "8243:8243"  # HTTPS gateway
      - "8280:8280"  # HTTP gateway
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=wso2_db
    volumes:
      - apim_conf:/home/wso2carbon/wso2-config-volume/repository/conf
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9743/services/Version || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  mysql_data:
  apim_conf: