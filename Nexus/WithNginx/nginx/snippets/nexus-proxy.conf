# Common proxy settings for every location that forwards traffic to Nexus.

proxy_http_version 1.1;

# Let Nexus know the original host and scheme so it builds correct URLs
proxy_set_header Host              $http_host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $http_host;

# Large artifacts and Docker layers: no size limit and stream uploads/downloads
client_max_body_size    0;
proxy_request_buffering off;
proxy_buffering         off;

# Long transfers (big uploads, slow remote proxies)
proxy_connect_timeout 60s;
proxy_send_timeout    900s;
proxy_read_timeout    900s;
send_timeout          900s;
