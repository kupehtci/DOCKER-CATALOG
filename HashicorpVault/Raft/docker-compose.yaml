version: '3.8'

services:
  vault-1:
    image: hashicorp/vault:latest
    container_name: vault-1
    hostname: vault-1
    cap_add:
      - IPC_LOCK
    ports:
      - "8201:8200"
    volumes:
      - vault_1_data:/vault/file
    environment:
      VAULT_LOCAL_CONFIG: |
        {
          "ui": true,
          "api_addr": "http://vault-1:8200",
          "cluster_addr": "http://vault-1:8201",
          "listener": [{
            "tcp": {
              "address": "0.0.0.0:8200",
              "cluster_address": "0.0.0.0:8201",
              "tls_disable": true
            }
          }],
          "storage": {
            "raft": {
              "path": "/vault/file",
              "node_id": "vault-1",
              "retry_join": [
                { "leader_api_addr": "http://vault-2:8200" },
                { "leader_api_addr": "http://vault-3:8200" }
              ]
            }
          },
          "default_lease_ttl": "168h",
          "max_lease_ttl": "720h"
        }
    command: server
    restart: unless-stopped
    networks:
      - vault-net

  vault-2:
    image: hashicorp/vault:latest
    container_name: vault-2
    hostname: vault-2
    cap_add:
      - IPC_LOCK
    ports:
      - "8202:8200"
    volumes:
      - vault_2_data:/vault/file
    environment:
      VAULT_LOCAL_CONFIG: |
        {
          "ui": true,
          "api_addr": "http://vault-2:8200",
          "cluster_addr": "http://vault-2:8201",
          "listener": [{
            "tcp": {
              "address": "0.0.0.0:8200",
              "cluster_address": "0.0.0.0:8201",
              "tls_disable": true
            }
          }],
          "storage": {
            "raft": {
              "path": "/vault/file",
              "node_id": "vault-2",
              "retry_join": [
                { "leader_api_addr": "http://vault-1:8200" },
                { "leader_api_addr": "http://vault-3:8200" }
              ]
            }
          },
          "default_lease_ttl": "168h",
          "max_lease_ttl": "720h"
        }
    command: server
    restart: unless-stopped
    networks:
      - vault-net

  vault-3:
    image: hashicorp/vault:latest
    container_name: vault-3
    hostname: vault-3
    cap_add:
      - IPC_LOCK
    ports:
      - "8203:8200"
    volumes:
      - vault_3_data:/vault/file
    environment:
      VAULT_LOCAL_CONFIG: |
        {
          "ui": true,
          "api_addr": "http://vault-3:8200",
          "cluster_addr": "http://vault-3:8201",
          "listener": [{
            "tcp": {
              "address": "0.0.0.0:8200",
              "cluster_address": "0.0.0.0:8201",
              "tls_disable": true
            }
          }],
          "storage": {
            "raft": {
              "path": "/vault/file",
              "node_id": "vault-3",
              "retry_join": [
                { "leader_api_addr": "http://vault-1:8200" },
                { "leader_api_addr": "http://vault-2:8200" }
              ]
            }
          },
          "default_lease_ttl": "168h",
          "max_lease_ttl": "720h"
        }
    command: server
    restart: unless-stopped
    networks:
      - vault-net

  vault-lb:
    image: nginx:alpine
    container_name: vault-lb
    depends_on:
      - vault-1
      - vault-2
      - vault-3
    ports:
      - "8200:8200"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    networks:
      - vault-net

volumes:
  vault_1_data:
    driver: local
  vault_2_data:
    driver: local
  vault_3_data:
    driver: local

networks:
  vault-net:
    driver: bridge